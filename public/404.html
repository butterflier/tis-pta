<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --paper:#F4F8FB; --ink:#161B42; --ink-soft:#5B6B8C;
    --accent:#2374A6; --accent-2:#3FB6D3; --card-bg:#FFFFFF; --line:#CBDCE6;
    --shadow: 0 1px 2px rgba(22,27,66,0.07), 0 4px 14px rgba(22,27,66,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1524; --ink:#E7ECF7; --ink-soft:#93A2C2;
      --accent:#5BC6E8; --accent-2:#2E8FBE; --card-bg:#141D31; --line:#2B3852;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Noto Sans KR",sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:380px; background:var(--card-bg); border:1px solid var(--line);
    border-radius:18px; box-shadow:var(--shadow); padding:40px 32px; text-align:center;
  }
  h1{font-size:19px;font-weight:900;margin:0 0 10px;}
  p{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:0 0 24px;}
  a{
    display:inline-block; padding:12px 22px; border-radius:10px;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
    color:#fff; text-decoration:none; font-size:14px; font-weight:700;
  }
</style>
<div class="card">
  <h1>코드를 찾을 수 없습니다</h1>
  <p>입력하신 코드가 정확한지 다시 확인해주세요.<br>계속 안 되면 담당 선생님께 문의해주세요.</p>
  <a href="/">코드 다시 입력하기</a>
</div>
